name: CI & Multi-Platform Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Test on all supported Go versions & platforms
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test · ${{ matrix.os }} · Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.21', '1.22', '1.23', '1.24']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Check go mod tidy (no drift)
        run: |
          go mod tidy
          git diff --exit-code go.mod
          if [ -f go.sum ]; then git diff --exit-code go.sum; fi
        shell: bash

      - name: Vet
        run: go vet ./...

      - name: Run Tests (Linux with Race Detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test -v -race -count=1 ./...

      - name: Run Tests (Windows / macOS)
        if: matrix.os != 'ubuntu-latest'
        run: go test -v -count=1 ./...

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Security scan (runs only on ubuntu, no matrix needed)
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run vulnerability check
        run: govulncheck ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Build cross-platform CLI binaries (only after tests pass)
  # ──────────────────────────────────────────────────────────────────────────
  build-binaries:
    name: Build · ${{ matrix.output }}
    needs: [test, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            output: goloadtest-linux-amd64
          - os: linux
            arch: arm64
            output: goloadtest-linux-arm64
          - os: windows
            arch: amd64
            output: goloadtest-windows-amd64.exe
          - os: darwin
            arch: amd64
            output: goloadtest-darwin-amd64
          - os: darwin
            arch: arm64
            output: goloadtest-darwin-arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" \
            -trimpath \
            -o dist/${{ matrix.output }} \
            ./cmd/goloadtest

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 30
          if-no-files-found: error
