name: CI & Multi-Platform Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Unit & Integration Tests across OS and Go versions
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test · ${{ matrix.os }} · Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go-version: ['1.21', '1.22', '1.23', '1.24']
        include:
          - os: windows-latest
            go-version: '1.24'
          - os: macos-latest
            go-version: '1.24'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Check go mod tidy (no drift)
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24'
        run: |
          go mod tidy
          git diff --exit-code go.mod
          if [ -f go.sum ]; then git diff --exit-code go.sum; fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (Linux with Race Detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test -v -race -count=1 ./...

      - name: Run Tests (Windows / macOS)
        if: matrix.os != 'ubuntu-latest'
        run: go test -v -count=1 ./...

      - name: Run Engine Benchmark (Sanity check)
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24'
        run: go test -bench=BenchmarkLoadEngine -run=^$ -benchtime=1x -v .

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Security & Vulnerability Scan
  # ──────────────────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Go Vulnerability Check (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.24'
          go-package: ./...

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Build Cross-Platform CLI Binaries
  # ──────────────────────────────────────────────────────────────────────────
  build-binaries:
    name: Build · ${{ matrix.output }}
    needs: [test, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            output: goloadtest-linux-amd64
          - os: linux
            arch: arm64
            output: goloadtest-linux-arm64
          - os: windows
            arch: amd64
            output: goloadtest-windows-amd64.exe
          - os: darwin
            arch: amd64
            output: goloadtest-darwin-amd64
          - os: darwin
            arch: arm64
            output: goloadtest-darwin-arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Determine Binary Version
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -ldflags="-s -w -X main.version=${{ steps.vars.outputs.VERSION }}" \
            -trimpath \
            -o dist/${{ matrix.output }} \
            ./cmd/goloadtest

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Publish GitHub Release (Only triggered on Git Tags)
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-binaries]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
