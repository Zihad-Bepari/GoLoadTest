name: CI & Multi-Platform Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Go Unit & Integration Tests (Linux with Race Detector)
  # ──────────────────────────────────────────────────────────────────────────
  test-go:
    name: Go Tests · ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.22.x', '1.23.x' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify module integrity
        run: go mod verify

      - name: Run Unit & Race Tests
        run: go test -v -race -count=1 ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Engine Benchmark (Sanity check)
        run: go test -bench=BenchmarkLoadEngine -run=^$ -benchtime=1x -v .

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Node.js Adapter Test
  # ──────────────────────────────────────────────────────────────────────────
  test-node:
    name: Node.js Tests · Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test Node.js Package Import & Execution
        run: |
          node -e "
            const { resolveBinary, loadtestMiddleware } = require('./adapters/nodejs/index.js');
            const bin = resolveBinary();
            console.log('Resolved binary:', bin);
            console.log('GoLoadTest Node.js adapter loaded successfully');
          "

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: PHP & Laravel Adapter Syntax Validation
  # ──────────────────────────────────────────────────────────────────────────
  test-php:
    name: PHP Syntax · PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Validate PHP Syntax
        run: |
          php -l adapters/php-laravel/src/GoLoadTest.php
          php -l adapters/php-laravel/src/GoLoadTestServiceProvider.php
          php -l adapters/php-laravel/src/Commands/LoadTestCommand.php

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Build Cross-Platform CLI Binaries
  # ──────────────────────────────────────────────────────────────────────────
  build-binaries:
    name: Build · ${{ matrix.output }}
    needs: [test-go]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            output: goloadtest-linux-amd64
          - os: linux
            arch: arm64
            output: goloadtest-linux-arm64
          - os: windows
            arch: amd64
            output: goloadtest-windows-amd64.exe
          - os: darwin
            arch: amd64
            output: goloadtest-darwin-amd64
          - os: darwin
            arch: arm64
            output: goloadtest-darwin-arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          VERSION="1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ github.sha }}" ]; then
            VERSION="$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          go build \
            -ldflags="-s -w -X 'main.version=${VERSION}'" \
            -trimpath \
            -o dist/${{ matrix.output }} \
            ./cmd/goloadtest

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 30
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Publish GitHub Release (Only triggered on Git Tags)
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-binaries]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
